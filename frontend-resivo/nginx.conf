# nginx for the Angular app (Single Page Application)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: routes like /recibos or /productos are not files, they exist only inside Angular.
  # If the file does not exist, answer index.html and let the Angular router show the page
  # (without this, refreshing the browser on /recibos gives 404)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html is never cached: after a new deploy the browser gets the new version
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # the .js/.css of the build have a hash in their name (main-7EAMF2IN.js),
  # so they can be cached for a long time: a new build changes the name
  location ~* \.(?:js|css|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # compress text files
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
