# Integration repo: the whole project with one command, from here.
#   docker compose up --build   (or: make levantar)
#
# It only INCLUDES the compose of each project, which live in their own repos
# (split from this one with git subtree):
#   backend-resivo/docker-compose.yml   -> db + api   (network red-db)
#   frontend-resivo/docker-compose.yml  -> web        (network red-web, does not see db)
# Each included file keeps its own folder: its relative paths (build, volumes, env_file)
# and its .env (published ports) are those of its folder.

name: resivos

include:
  - backend-resivo/docker-compose.yml
  - frontend-resivo/docker-compose.yml
