# "Production" on your machine: the same images that go to Render, run as in production,
# to test them before deploying. Used by `make deploy` (do not use it for development).
#
# Differences with docker-compose.yml (development):
# - uses already built images with a version (VERSION), it does not build
# - the database is NOT published: only the API can reach it, inside red-db
# - the data is in a named volume (resivos-prod-datos), not in database/data
# - own credentials, generated by `make deploy` in deploy/prod.env (ignored by git)
# - the API connects with DATABASE_URL, exactly like on Render
# - the API is published on PROD_PORT (8080 by default), so it does not collide with development

name: resivos-prod

services:
  db:
    image: resivos-db:${VERSION:?falta VERSION (usá make deploy)}
    restart: unless-stopped
    env_file: ./deploy/prod.env
    volumes:
      - datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red-db

  api:
    image: resivos-api:${VERSION:?falta VERSION (usá make deploy)}
    restart: unless-stopped
    env_file: ./deploy/prod.env
    environment:
      PORT: 3000
    ports:
      - "${PROD_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-db

volumes:
  datos:
    name: resivos-prod-datos

networks:
  red-db:
